# Ping diário no Supabase para o projeto (plano free) não ser pausado por inatividade.
# Funciona mesmo com o back-end desligado: chama a função keep_alive_ping() pela API REST.
# Configure em Settings > Secrets and variables > Actions:
#   SUPABASE_URL              = https://<seu-projeto>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  = sb_publishable_...
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 * * *"   # todo dia às 12:00 UTC (09:00 em Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive_ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_origem":"github-actions"}'
